<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="GitDeck — a fast, cross-platform web Git GUI with commit graph, worktrees and full Git operations." />
    <title>GitDeck</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b8def'/%3E%3Ccircle cx='10' cy='10' r='3' fill='white'/%3E%3Ccircle cx='22' cy='22' r='3' fill='white'/%3E%3Cpath d='M10 13v4a8 8 0 0 0 8 8h4' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Apply persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('gitdeck.theme');
          if (stored) {
            var parsed = JSON.parse(stored);
            var mode = parsed && parsed.mode ? parsed.mode : 'dark';
            var resolved =
              mode === 'system'
                ? window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark'
                : mode;
            document.documentElement.setAttribute('data-theme', resolved);
            if (parsed && parsed.accent) document.documentElement.style.setProperty('--accent', parsed.accent);
          }
        } catch (error) {
          /* ignore corrupted storage */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

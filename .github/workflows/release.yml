name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: SEA binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            asset: gitdeck-linux-x64
            built: gitdeck
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            asset: gitdeck-linux-arm64
            built: gitdeck
          - os: windows-latest
            platform: windows-x64
            asset: gitdeck-windows-x64.exe
            built: gitdeck.exe
          - os: macos-latest
            platform: macos-arm64
            asset: gitdeck-macos-arm64
            built: gitdeck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build single-file executable (Node SEA)
        run: pnpm build:sea

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "build/sea/${{ matrix.built }}" "out/${{ matrix.asset }}"
          chmod +x "out/${{ matrix.asset }}" || true
          file "out/${{ matrix.asset }}" || true
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitdeck-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show assets
        shell: bash
        run: ls -lh dist

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum gitdeck-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "publishing $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "GitDeck $TAG" --notes-from-tag >/dev/null 2>&1 || true
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GitDeck $TAG" \
              --generate-notes
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "GitDeck $TAG" \
              --generate-notes \
              --target main
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets \
            --jq '{url: .url, assets: [.assets[].name]}'
